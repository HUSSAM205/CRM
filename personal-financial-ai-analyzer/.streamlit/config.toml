# Project Streamlit settings (read automatically when the app is started from this folder).
[browser]
gatherUsageStats = false       # privacy: no usage telemetry leaves the computer (security audit S-03)
serverAddress = "localhost"    # the URL shown to the user

[client]
showErrorDetails = "type"      # show only the error type, not tracebacks or data in the browser (S-04)
toolbarMode = "minimal"

[server]
address = "127.0.0.1"          # local only: not reachable from other computers on the network (MA3-08)
port = 8501
headless = true                # no first-run e-mail prompt; scripts/run_application.py opens the browser itself
maxUploadSize = 50             # MB; matches configs/app.yaml upload.max_bytes (HW2 Table 10.1)
