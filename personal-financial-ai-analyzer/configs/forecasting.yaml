target: monthly expenses (outflow + fee - refund) per account and currency, integer cents (D-12)
baselines: [naive, seasonal_naive, moving_average_3]
ets:
  model: ETS(A,N,N) simple exponential smoothing, statsmodels ExponentialSmoothing, estimated init
gbr:
  implementation: sklearn HistGradientBoostingRegressor
  features: [lag_1, lag_2, lag_3, rolling_mean_6, month]      # HW2 5.4
  ablation_features: [lag_1, lag_2, lag_3, rolling_mean_6, month, lag_12]   # gbr_seasonal (CF-14)
  grid:
    learning_rate: [0.05, 0.1]
    max_iter: [100, 300]
    max_depth: [3, 6]
    loss: [squared_error, absolute_error]
  random_state: 42
selection_rule: advanced model kept only if it beats the best baseline on BOTH validation MAE and MASE
