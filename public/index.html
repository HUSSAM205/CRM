<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GradTrack — Graduation Project CRM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563EB'/%3E%3Cpath d='M7 12.5l3 3 7-7' stroke='white' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --color-primary:#2563EB;
    --color-primary-hover:#1D4ED8;
    --color-on-primary:#FFFFFF;
    --color-accent:#059669;
    --color-accent-hover:#047857;
    --color-background:#F8FAFC;
    --color-surface:#FFFFFF;
    --color-foreground:#0F172A;
    --color-muted:#F1F5FD;
    --color-muted-foreground:#64748B;
    --color-border:#E4ECFC;
    --color-destructive:#DC2626;
    --color-destructive-bg:#FEF2F2;
    --color-warning:#D97706;
    --color-warning-bg:#FFFBEB;
    --color-success-bg:#ECFDF5;
    --color-ring:#2563EB;
    --shadow-sm:0 1px 2px rgba(15,23,42,.06);
    --shadow-md:0 4px 12px rgba(15,23,42,.08);
    --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-8:48px;
    --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
    color-scheme: light;
  }
  :root[data-theme="dark"], :root:not([data-theme="light"]) {
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --color-primary:#3B82F6;
      --color-primary-hover:#60A5FA;
      --color-on-primary:#0B1220;
      --color-accent:#10B981;
      --color-accent-hover:#34D399;
      --color-background:#0B1220;
      --color-surface:#121B2D;
      --color-foreground:#F1F5F9;
      --color-muted:#1B2637;
      --color-muted-foreground:#94A3B8;
      --color-border:#233047;
      --color-destructive:#F87171;
      --color-destructive-bg:#3A1B1E;
      --color-warning:#FBBF24;
      --color-warning-bg:#3A2E12;
      --color-success-bg:#0F2B22;
      --color-ring:#60A5FA;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --color-primary:#3B82F6;
    --color-primary-hover:#60A5FA;
    --color-on-primary:#0B1220;
    --color-accent:#10B981;
    --color-accent-hover:#34D399;
    --color-background:#0B1220;
    --color-surface:#121B2D;
    --color-foreground:#F1F5F9;
    --color-muted:#1B2637;
    --color-muted-foreground:#94A3B8;
    --color-border:#233047;
    --color-destructive:#F87171;
    --color-destructive-bg:#3A1B1E;
    --color-warning:#FBBF24;
    --color-warning-bg:#3A2E12;
    --color-success-bg:#0F2B22;
    --color-ring:#60A5FA;
    color-scheme: dark;
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:var(--color-background);
    color:var(--color-foreground);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;font-weight:700;}
  p{margin:0;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:8px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }

  :focus-visible{outline:2px solid var(--color-ring);outline-offset:2px;border-radius:4px;}

  .icon{width:20px;height:20px;flex-shrink:0;}
  .icon-sm{width:16px;height:16px;}
  .icon-lg{width:28px;height:28px;}

  /* ---------- App shell ---------- */
  .app{display:flex;min-height:100vh;}

  .sidebar{
    width:248px;flex-shrink:0;background:var(--color-surface);border-right:1px solid var(--color-border);
    display:flex;flex-direction:column;padding:var(--space-5) var(--space-4);gap:var(--space-6);
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);}
  .brand-mark{width:36px;height:36px;border-radius:10px;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:var(--color-on-primary);flex-shrink:0;}
  .brand-text{display:flex;flex-direction:column;line-height:1.2;}
  .brand-text strong{font-size:16px;font-weight:800;}
  .brand-text span{font-size:12px;color:var(--color-muted-foreground);}

  .nav-list{display:flex;flex-direction:column;gap:var(--space-1);list-style:none;margin:0;padding:0;}
  .nav-item{
    display:flex;align-items:center;gap:var(--space-3);padding:10px var(--space-3);border-radius:var(--radius-sm);
    color:var(--color-muted-foreground);text-decoration:none;font-weight:600;font-size:14px;border:none;background:none;width:100%;text-align:left;
    min-height:44px;
  }
  .nav-item:hover{background:var(--color-muted);color:var(--color-foreground);}
  .nav-item[aria-current="page"]{background:var(--color-primary);color:var(--color-on-primary);}
  .nav-item[aria-current="page"] .icon{color:var(--color-on-primary);}

  .sidebar-footer{margin-top:auto;display:flex;flex-direction:column;gap:var(--space-2);}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius-sm);
    border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-foreground);
  }
  .icon-btn:hover{background:var(--color-muted);}
  .footer-row{display:flex;gap:var(--space-2);}
  .footer-row .icon-btn{flex:1;}

  main{flex:1;min-width:0;padding:var(--space-6) var(--space-6) calc(var(--space-8) + 64px);}
  @media (max-width:768px){
    .sidebar{display:none;}
    main{padding:var(--space-4) var(--space-4) 88px;}
  }

  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap;}
  .topbar h1{font-size:24px;}
  .topbar p{color:var(--color-muted-foreground);font-size:14px;margin-top:4px;}

  .btn{
    display:inline-flex;align-items:center;gap:var(--space-2);padding:10px var(--space-4);border-radius:var(--radius-sm);
    font-weight:600;font-size:14px;border:1px solid transparent;min-height:44px;white-space:nowrap;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .btn-primary{background:var(--color-primary);color:var(--color-on-primary);}
  .btn-primary:hover{background:var(--color-primary-hover);}
  .btn-secondary{background:var(--color-surface);border-color:var(--color-border);color:var(--color-foreground);}
  .btn-secondary:hover{background:var(--color-muted);}
  .btn-danger{background:transparent;color:var(--color-destructive);border-color:transparent;}
  .btn-danger:hover{background:var(--color-destructive-bg);}
  .btn-sm{min-height:36px;padding:6px var(--space-3);font-size:13px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav{
    display:none;position:fixed;bottom:0;left:0;right:0;background:var(--color-surface);
    border-top:1px solid var(--color-border);z-index:40;padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav-list{display:flex;list-style:none;margin:0;padding:6px var(--space-2);gap:4px;}
  .bottom-nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:none;background:none;
    color:var(--color-muted-foreground);font-size:11px;font-weight:600;border-radius:var(--radius-sm);min-height:48px;
  }
  .bottom-nav-item[aria-current="page"]{color:var(--color-primary);}
  @media (max-width:768px){.bottom-nav{display:block;}}

  /* ---------- Cards / stats ---------- */
  .grid{display:grid;gap:var(--space-4);}
  .stat-grid{grid-template-columns:repeat(4,1fr);}
  @media (max-width:1024px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.stat-grid{grid-template-columns:1fr;}}

  .card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-5);box-shadow:var(--shadow-sm);}
  .stat-card{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);}
  .stat-card .value{font-size:28px;font-weight:800;margin-top:6px;}
  .stat-card .label{font-size:13px;color:var(--color-muted-foreground);font-weight:600;}
  .stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .section-title{font-size:16px;font-weight:700;margin-bottom:var(--space-4);display:flex;align-items:center;justify-content:space-between;}


  .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--space-4);margin-top:var(--space-4);align-items:start;}
  @media (max-width:1024px){.dash-grid{grid-template-columns:1fr;}}

  .workload-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;}
  .avatar{
    width:36px;height:36px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13px;color:#fff;flex-shrink:0;
  }
  .workload-info{flex:1;min-width:0;}
  .workload-info .name{font-weight:600;font-size:14px;}
  .workload-info .role{font-size:12px;color:var(--color-muted-foreground);}
  .workload-bar-track{height:6px;background:var(--color-muted);border-radius:99px;margin-top:6px;overflow:hidden;}
  .workload-bar-fill{height:100%;background:var(--color-accent);border-radius:99px;}
  .workload-count{font-weight:700;font-size:13px;color:var(--color-muted-foreground);width:44px;text-align:right;}

  .milestone-mini{display:flex;gap:var(--space-3);padding:var(--space-3) 0;border-top:1px solid var(--color-border);}
  .milestone-mini:first-child{border-top:none;padding-top:0;}
  .milestone-mini .dot{width:10px;height:10px;border-radius:99px;margin-top:5px;flex-shrink:0;}
  .milestone-mini .title{font-weight:600;font-size:14px;}
  .milestone-mini .meta{font-size:12px;color:var(--color-muted-foreground);margin-top:2px;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;}
  .badge-low{background:var(--color-muted);color:var(--color-muted-foreground);}
  .badge-medium{background:var(--color-warning-bg);color:var(--color-warning);}
  .badge-high{background:var(--color-destructive-bg);color:var(--color-destructive);}
  .badge-overdue{background:var(--color-destructive-bg);color:var(--color-destructive);}
  .badge-done{background:var(--color-success-bg);color:var(--color-accent);}
  .badge-upcoming{background:var(--color-muted);color:var(--color-primary);}

  /* ---------- Team ---------- */
  .team-grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));}
  .team-card{display:flex;flex-direction:column;gap:var(--space-3);}
  .team-card-top{display:flex;align-items:center;gap:var(--space-3);}
  .team-card .avatar{width:48px;height:48px;font-size:16px;}
  .team-card .name{font-size:15px;font-weight:700;}
  .team-card .role{font-size:13px;color:var(--color-primary);font-weight:600;}
  .team-contact{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--color-muted-foreground);}
  .team-contact div{display:flex;align-items:center;gap:8px;}
  .team-card-actions{display:flex;gap:var(--space-2);margin-top:auto;padding-top:var(--space-2);border-top:1px solid var(--color-border);}

  .team-files{padding-top:var(--space-3);border-top:1px solid var(--color-border);}
  .team-files-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-2);}
  .team-files-head span{font-size:11px;font-weight:700;color:var(--color-muted-foreground);text-transform:uppercase;letter-spacing:.05em;}
  .file-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .file-item{display:flex;align-items:center;gap:8px;font-size:12.5px;background:var(--color-muted);border-radius:var(--radius-sm);padding:6px 8px;transition:background .15s ease;}
  .file-item:hover{background:color-mix(in srgb, var(--color-primary) 10%, var(--color-muted));}
  .file-item a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--color-foreground);text-decoration:none;font-weight:600;}
  .file-item a:hover{color:var(--color-primary);}
  .file-item a .icon{width:15px;height:15px;flex-shrink:0;color:var(--color-primary);}
  .file-size{color:var(--color-muted-foreground);font-size:11px;flex-shrink:0;}
  .file-item .icon-btn{width:26px;height:26px;flex-shrink:0;}
  .file-empty{font-size:12.5px;color:var(--color-muted-foreground);}

  /* ---------- Kanban ---------- */
  .kanban-toolbar{display:flex;gap:var(--space-3);align-items:center;margin-bottom:var(--space-4);flex-wrap:wrap;}
  .select, .input, textarea{
    background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);
    padding:10px 12px;min-height:44px;color:var(--color-foreground);width:100%;
  }
  .select{padding-right:28px;}
  textarea{min-height:88px;resize:vertical;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--space-4);}
  .field label{font-size:13px;font-weight:600;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);}
  @media (max-width:480px){.field-row{grid-template-columns:1fr;}}

  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);align-items:start;}
  @media (max-width:900px){.kanban{grid-template-columns:1fr;}}
  .kanban-col{background:var(--color-muted);border-radius:var(--radius-md);padding:var(--space-3);min-height:120px;}
  .kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:var(--space-2);margin-bottom:var(--space-2);}
  .kanban-col-head h3{font-size:14px;}
  .count-pill{background:var(--color-surface);border:1px solid var(--color-border);font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:var(--color-muted-foreground);}
  .kanban-col.drag-over{outline:2px dashed var(--color-primary);outline-offset:-4px;}
  .task-card{
    background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-3);
    margin-bottom:var(--space-3);cursor:grab;box-shadow:var(--shadow-sm);
  }
  .task-card:active{cursor:grabbing;}
  .task-card:last-child{margin-bottom:0;}
  .task-card-top{display:flex;justify-content:space-between;gap:var(--space-2);align-items:flex-start;}
  .task-card .title{font-weight:600;font-size:14px;}
  .task-card .desc{font-size:12px;color:var(--color-muted-foreground);margin-top:4px;}
  .task-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-3);gap:var(--space-2);}
  .task-assignee{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--color-muted-foreground);font-weight:600;}
  .task-assignee .avatar{width:22px;height:22px;font-size:10px;}
  .task-due{font-size:12px;color:var(--color-muted-foreground);display:flex;align-items:center;gap:4px;}
  .empty-col{text-align:center;color:var(--color-muted-foreground);font-size:13px;padding:var(--space-5) var(--space-2);}

  /* ---------- Timeline ---------- */
  .timeline{position:relative;padding-left:36px;}
  .timeline::before{content:"";position:absolute;left:13px;top:6px;bottom:6px;width:2px;background:var(--color-border);}
  .timeline-item{position:relative;padding-bottom:var(--space-5);}
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-dot{
    position:absolute;left:-36px;top:0;width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;
    border:2px solid var(--color-surface);color:#fff;
  }
  .timeline-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-4);}
  .timeline-card-top{display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;}
  .timeline-card h4{font-size:15px;}
  .timeline-date{font-size:12px;color:var(--color-muted-foreground);font-weight:600;margin-top:2px;}
  .timeline-desc{font-size:13px;color:var(--color-muted-foreground);margin-top:8px;}
  .timeline-actions{display:flex;gap:var(--space-2);margin-top:var(--space-3);}

  .empty-state{text-align:center;padding:var(--space-8) var(--space-4);color:var(--color-muted-foreground);}
  .empty-state .icon-lg{margin:0 auto var(--space-3);color:var(--color-muted-foreground);}

  /* ---------- Modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;
    padding:var(--space-4);z-index:100;
  }
  .modal{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-6);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5);}
  .modal-head h2{font-size:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:var(--space-3);margin-top:var(--space-5);}
  .modal-actions .btn{flex:0 0 auto;}

  .toast{
    position:fixed;top:20px;right:20px;background:var(--color-surface);color:var(--color-foreground);
    padding:13px 18px;border-radius:var(--radius-md);font-size:14px;font-weight:600;z-index:400;box-shadow:var(--shadow-md);
    border:1px solid var(--color-border);border-left:3px solid var(--color-accent);
    display:flex;align-items:center;gap:10px;
    opacity:0;pointer-events:none;transform:translateX(120%);transition:opacity .4s cubic-bezier(.16,1,.3,1), transform .4s cubic-bezier(.16,1,.3,1);
  }
  .toast .icon{color:var(--color-accent);}
  .toast.show{opacity:1;transform:translateX(0);}
  @media (max-width:768px){.toast{left:16px;right:16px;top:16px;}}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

  /* ---------- Motion ---------- */
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.96) translateY(4px);}to{opacity:1;transform:scale(1) translateY(0);}}
  @keyframes scaleOut{from{opacity:1;transform:scale(1) translateY(0);}to{opacity:0;transform:scale(.96) translateY(4px);}}
  @keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.35);}50%{box-shadow:0 0 0 6px rgba(37,99,235,0);}}

  #main.page-enter{animation:fadeInUp .35s cubic-bezier(.16,1,.3,1);}
  @keyframes pageEnterRight{from{opacity:0;transform:translateX(28px);filter:blur(4px);}to{opacity:1;transform:translateX(0);filter:blur(0);}}
  @keyframes pageEnterLeft{from{opacity:0;transform:translateX(-28px);filter:blur(4px);}to{opacity:1;transform:translateX(0);filter:blur(0);}}
  #main.page-enter-right{animation:pageEnterRight .4s cubic-bezier(.16,1,.3,1);}
  #main.page-enter-left{animation:pageEnterLeft .4s cubic-bezier(.16,1,.3,1);}

  .stagger-item{opacity:0;animation:fadeInUp .4s cubic-bezier(.16,1,.3,1) forwards;}

  .btn:active{transform:scale(.97);}
  .icon-btn{transition:background .15s ease, transform .1s ease;}
  .icon-btn:active{transform:scale(.92);}
  .nav-item{transition:background .18s ease, color .18s ease;}

  .card.stat-card, .team-card, .task-card{transition:transform .15s ease, box-shadow .15s ease;}
  .card.stat-card:hover, .team-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .task-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .task-card.dragging{opacity:.5;transform:scale(.97);}
  .kanban-col{transition:background .15s ease;}

  .timeline-dot.pulse{animation:pulseDot 2s ease-in-out infinite;}

  .modal-backdrop{animation:fadeIn .18s ease;}
  .modal-backdrop.closing{animation:fadeOut .15s ease forwards;}
  .modal{animation:scaleIn .22s cubic-bezier(.16,1,.3,1);}
  .modal.closing{animation:scaleOut .15s ease forwards;}

  /* ---------- Ambient background ---------- */
  .bg-orbs{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.32;animation:orbFloat 24s ease-in-out infinite;}
  .orb-1{width:440px;height:440px;background:radial-gradient(circle, var(--color-primary), transparent 70%);top:-140px;left:-100px;animation-duration:24s;}
  .orb-2{width:380px;height:380px;background:radial-gradient(circle, var(--color-accent), transparent 70%);bottom:-160px;right:-90px;animation-duration:28s;animation-delay:-6s;}
  .orb-3{width:300px;height:300px;background:radial-gradient(circle, #7C3AED, transparent 70%);top:38%;right:12%;animation-duration:20s;animation-delay:-3s;}
  @keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(30px,-40px) scale(1.08);}66%{transform:translate(-20px,25px) scale(.95);}}
  .app,#modal-root{position:relative;z-index:1;}

  /* ---------- Splash ---------- */
  .splash{position:fixed;inset:0;background:var(--color-background);display:flex;align-items:center;justify-content:center;z-index:600;transition:opacity .5s ease, visibility .5s ease;}
  .splash.hide{opacity:0;visibility:hidden;}
  .splash-mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--color-primary),#7C3AED);display:flex;align-items:center;justify-content:center;color:#fff;animation:splashPulse 1.1s ease-in-out infinite;box-shadow:0 0 40px color-mix(in srgb, var(--color-primary) 55%, transparent);}
  @keyframes splashPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}

  /* ---------- Brand & headings ---------- */
  .brand-mark{background:linear-gradient(135deg,var(--color-primary),#7C3AED) !important;box-shadow:0 0 22px color-mix(in srgb, var(--color-primary) 45%, transparent);animation:brandGlow 4s ease-in-out infinite;}
  @keyframes brandGlow{0%,100%{box-shadow:0 0 16px color-mix(in srgb, var(--color-primary) 35%, transparent);}50%{box-shadow:0 0 28px color-mix(in srgb, var(--color-primary) 60%, transparent);}}
  .topbar h1{background:linear-gradient(135deg,var(--color-foreground),var(--color-primary) 130%);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em;}

  /* ---------- Sliding nav indicator ---------- */
  .nav-list-wrap{position:relative;}
  .nav-indicator{position:absolute;left:0;right:0;top:0;height:44px;background:linear-gradient(135deg,var(--color-primary),#7C3AED);border-radius:var(--radius-sm);z-index:0;pointer-events:none;box-shadow:0 4px 14px color-mix(in srgb, var(--color-primary) 40%, transparent);transition:transform .4s cubic-bezier(.16,1,.3,1), height .4s cubic-bezier(.16,1,.3,1), opacity .2s ease;opacity:0;}
  .nav-indicator.ready{opacity:1;}
  .nav-item{position:relative;z-index:1;}
  .nav-item[aria-current="page"],.nav-item[aria-current="page"]:hover{background:none;}

  /* ---------- Buttons ---------- */
  .btn-primary{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-hover));}
  .btn-primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);transform:skewX(-20deg);transition:left .6s ease;}
  .btn-primary:hover::after{left:120%;}

  /* ---------- Progress rings ---------- */
  .ring-header{display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-5);}
  .ring-wrap{position:relative;display:inline-flex;flex-shrink:0;}
  .ring-fill{transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1);}
  .ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}

  /* ---------- Tilt cards ---------- */
  .task-card,.team-card{will-change:transform;}

  /* ---------- Confetti ---------- */
  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:500;overflow:hidden;}
  .confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFly .9s cubic-bezier(.2,.8,.3,1) forwards;}
  @keyframes confettiFly{0%{transform:translate(0,0) rotate(0deg);opacity:1;}100%{transform:translate(var(--dx),calc(var(--dy) + 140px)) rotate(var(--rot));opacity:0;}}

  /* ---------- View-transition theme swap ---------- */
  ::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal;}
  ::view-transition-old(root){z-index:1;}
  ::view-transition-new(root){z-index:2;}

  @media (prefers-reduced-motion: reduce){
    #main.page-enter,#main.page-enter-right,#main.page-enter-left,.stagger-item,.modal-backdrop,.modal,.timeline-dot.pulse,.orb,.splash-mark,.brand-mark{animation:none !important;opacity:1 !important;filter:none !important;}
  }
</style>
</head>
<body>
<div class="bg-orbs" aria-hidden="true"><span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span></div>
<div id="app" class="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-input" accept="application/json" class="visually-hidden">
<input type="file" id="member-file-input" multiple class="visually-hidden">
<div id="splash" class="splash" aria-hidden="true"><div class="splash-mark"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18"/><path d="M6 4.5h9.5l-1.5 3 1.5 3H6"/></svg></div></div>

<script>
(function(){
  "use strict";

  /* ===================== Icons ===================== */
  function svg(paths, extra){
    return '<svg class="icon'+(extra?' '+extra:'')+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths+'</svg>';
  }
  var ICONS = {
    dashboard: svg('<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>'),
    users: svg('<circle cx="9" cy="8" r="3.25"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="8.5" r="2.5"/><path d="M15.5 14.2c2.7.4 4.5 2.7 4.5 5.8"/>'),
    tasks: svg('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2 2 5-5"/>'),
    flag: svg('<path d="M6 3v18"/><path d="M6 4.5h9.5l-1.5 3 1.5 3H6"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    trash: svg('<path d="M4 7h16"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/><path d="M6 7l1 13a2 2 0 002 2h6a2 2 0 002-2l1-13"/><path d="M10 11v6M14 11v6"/>'),
    edit: svg('<path d="M4 20h4L18.5 9.5a2 2 0 000-2.8l-1.2-1.2a2 2 0 00-2.8 0L4 15.5V20z"/><path d="M14 6l4 4"/>'),
    x: svg('<path d="M6 6l12 12M18 6L6 18"/>'),
    sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/>'),
    moon: svg('<path d="M20 14.5A8.5 8.5 0 1110 3.3a7 7 0 0010 11.2z"/>'),
    download: svg('<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>'),
    upload: svg('<path d="M12 21V9"/><path d="M7 14l5-5 5 5"/><path d="M5 20h14"/>'),
    mail: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'),
    phone: svg('<path d="M6.5 3h3l1.5 4.5-2.2 1.6a11 11 0 005.1 5.1l1.6-2.2L20 13.5v3a2 2 0 01-2.2 2A16 16 0 014.5 5.2 2 2 0 016.5 3z"/>'),
    alert: svg('<path d="M12 3.5l9.5 16.5H2.5z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/>'),
    calendar: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>'),
    check: svg('<path d="M5 13l4 4 10-10"/>'),
    empty: svg('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 13h3M8 16.5h6"/>', 'icon-lg'),
    grip: svg('<circle cx="9" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1" fill="currentColor" stroke="none"/>'),
    file: svg('<path d="M7 3h7l4 4v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M14 3v4h4"/>'),
    clip: svg('<path d="M8 12l6.5-6.5a3 3 0 014.24 4.24L10.5 18a1.5 1.5 0 01-2.12-2.12L15 9"/>')
  };

  /* ===================== State & API ===================== */
  var THEME_KEY = 'gradtrack_theme';
  var AVATAR_COLORS = ['#2563EB','#059669','#D97706','#7C3AED','#DB2777','#0891B2'];

  function api(method, url, body){
    var opts = { method: method, headers: {} };
    if(body !== undefined){
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch(url, opts).then(function(res){
      if(!res.ok){
        return res.json().catch(function(){ return {}; }).then(function(err){
          throw new Error(err.error || ('Request failed ('+res.status+')'));
        });
      }
      if(res.status === 204) return null;
      return res.json();
    });
  }

  function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
  function addDays(n){ var d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
  function fmtDate(iso){
    if(!iso) return '—';
    var d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
  }
  function daysUntil(iso){
    var d = new Date(iso+'T00:00:00'), t = new Date(todayISO()+'T00:00:00');
    return Math.round((d-t)/86400000);
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function initials(name){
    var parts = (name||'').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '?';
    return (parts[0][0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function colorFor(id){
    var sum=0; for(var i=0;i<id.length;i++) sum+=id.charCodeAt(i);
    return AVATAR_COLORS[sum % AVATAR_COLORS.length];
  }
  function formatBytes(n){
    if(n < 1024) return n+' B';
    if(n < 1024*1024) return Math.round(n/1024)+' KB';
    return (n/1024/1024).toFixed(1)+' MB';
  }

  var state = {
    data: { team: [], tasks: [], milestones: [] },
    page: 'dashboard',
    taskFilter: 'all',
    loaded: false
  };

  function loadData(){
    return api('GET', '/api/data').then(function(data){
      state.data = data;
      state.loaded = true;
    });
  }

  /* ===================== Toast ===================== */
  var toastTimer;
  function toast(msg){
    var el = document.getElementById('toast');
    el.innerHTML = ICONS.check.replace('icon','icon icon-sm')+'<span>'+escapeHtml(msg)+'</span>';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3000);
  }

  /* ===================== Theme ===================== */
  function initTheme(){
    var saved = localStorage.getItem(THEME_KEY);
    if(saved) document.documentElement.setAttribute('data-theme', saved);
  }
  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function applyThemeChange(){
    var current = document.documentElement.getAttribute('data-theme');
    var isDark = current ? current==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    renderShell();
  }
  function toggleTheme(e){
    if(!document.startViewTransition || prefersReducedMotion){
      applyThemeChange();
      return;
    }
    var x = e ? e.clientX : window.innerWidth/2;
    var y = e ? e.clientY : window.innerHeight/2;
    var endRadius = Math.hypot(Math.max(x, window.innerWidth-x), Math.max(y, window.innerHeight-y));
    var transition = document.startViewTransition(applyThemeChange);
    transition.ready.then(function(){
      document.documentElement.animate(
        { clipPath: ['circle(0px at '+x+'px '+y+'px)', 'circle('+endRadius+'px at '+x+'px '+y+'px)'] },
        { duration: 550, easing: 'ease-in-out', pseudoElement: '::view-transition-new(root)' }
      );
    });
  }
  function isDarkMode(){
    var current = document.documentElement.getAttribute('data-theme');
    return current ? current==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  /* ===================== Nav config ===================== */
  var NAV = [
    {id:'dashboard', label:'Dashboard', icon:ICONS.dashboard},
    {id:'team', label:'Team', icon:ICONS.users},
    {id:'tasks', label:'Tasks', icon:ICONS.tasks},
    {id:'milestones', label:'Milestones', icon:ICONS.flag}
  ];

  function goTo(page){
    if(page===state.page) return;
    var ids = NAV.map(function(n){return n.id;});
    var dir = ids.indexOf(page) >= ids.indexOf(state.page) ? 'right' : 'left';
    state.page = page;
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function(btn){
      if(btn.getAttribute('data-nav')===page) btn.setAttribute('aria-current','page');
      else btn.removeAttribute('aria-current');
    });
    positionNavIndicator();
    renderPage(dir);
    window.scrollTo(0,0);
  }

  /* ===================== Shell render ===================== */
  function renderShell(){
    var app = document.getElementById('app');
    var themeIcon = isDarkMode() ? ICONS.sun : ICONS.moon;
    var themeLabel = isDarkMode() ? 'Switch to light theme' : 'Switch to dark theme';

    app.innerHTML =
      '<nav class="sidebar" aria-label="Primary">'+
        '<div class="brand"><div class="brand-mark">'+ICONS.flag+'</div>'+
          '<div class="brand-text"><strong>GradTrack</strong><span>Graduation Project CRM</span></div></div>'+
        '<div class="nav-list-wrap"><div class="nav-indicator" id="nav-indicator"></div><ul class="nav-list">'+
          NAV.map(function(n){
            return '<li><button class="nav-item" data-nav="'+n.id+'" '+(state.page===n.id?'aria-current="page"':'')+'>'+n.icon+'<span>'+n.label+'</span></button></li>';
          }).join('')+
        '</ul></div>'+
        '<div class="sidebar-footer">'+
          '<div class="footer-row">'+
            '<button class="icon-btn" id="theme-toggle" aria-label="'+themeLabel+'" title="'+themeLabel+'">'+themeIcon+'</button>'+
            '<button class="icon-btn" id="export-btn" aria-label="Export data as JSON" title="Export data">'+ICONS.download+'</button>'+
            '<button class="icon-btn" id="import-btn" aria-label="Import data from JSON" title="Import data">'+ICONS.upload+'</button>'+
          '</div>'+
        '</div>'+
      '</nav>'+
      '<main id="main" tabindex="-1"></main>'+
      '<nav class="bottom-nav" aria-label="Primary">'+
        '<ul class="bottom-nav-list">'+
          NAV.map(function(n){
            return '<li style="flex:1"><button class="bottom-nav-item" data-nav="'+n.id+'" '+(state.page===n.id?'aria-current="page"':'')+'>'+n.icon+'<span>'+n.label+'</span></button></li>';
          }).join('')+
        '</ul>'+
      '</nav>';

    Array.prototype.forEach.call(app.querySelectorAll('[data-nav]'), function(btn){
      btn.addEventListener('click', function(){ goTo(btn.getAttribute('data-nav')); });
    });
    document.getElementById('theme-toggle').addEventListener('click', function(e){ toggleTheme(e); });
    document.getElementById('export-btn').addEventListener('click', exportData);
    document.getElementById('import-btn').addEventListener('click', function(){ document.getElementById('import-input').click(); });

    positionNavIndicator();
    renderPage();
  }

  function positionNavIndicator(){
    var indicator = document.getElementById('nav-indicator');
    var active = document.querySelector('.nav-list .nav-item[aria-current="page"]');
    if(!indicator || !active) return;
    indicator.style.transform = 'translateY('+active.offsetTop+'px)';
    indicator.style.height = active.offsetHeight+'px';
    requestAnimationFrame(function(){ indicator.classList.add('ready'); });
  }

  /* ===================== Page router ===================== */
  function renderPage(dir){
    var main = document.getElementById('main');
    if(state.page==='dashboard') main.innerHTML = pageDashboard();
    else if(state.page==='team') main.innerHTML = pageTeam();
    else if(state.page==='tasks') main.innerHTML = pageTasks();
    else if(state.page==='milestones') main.innerHTML = pageMilestones();
    main.classList.remove('page-enter','page-enter-right','page-enter-left');
    void main.offsetWidth;
    main.classList.add(dir==='right' ? 'page-enter-right' : dir==='left' ? 'page-enter-left' : 'page-enter');
    wirePage();
    animateStats();
    animateProgressBars();
  }

  function animateStats(){
    var els = document.querySelectorAll('.count-up[data-target]');
    Array.prototype.forEach.call(els, function(el){
      var target = parseInt(el.getAttribute('data-target'),10) || 0;
      var start = null, duration = 700;
      function tick(ts){
        if(start===null) start = ts;
        var p = Math.min(1, (ts-start)/duration);
        var eased = 1 - Math.pow(1-p, 3);
        el.textContent = Math.round(target*eased);
        if(p<1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  function animateProgressBars(){
    var els = document.querySelectorAll('.workload-bar-fill[data-target], .ring-fill[data-target-offset]');
    if(!els.length) return;
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        Array.prototype.forEach.call(els, function(el){
          if(el.hasAttribute('data-target-offset')) el.style.strokeDashoffset = el.getAttribute('data-target-offset');
          else el.style.width = el.getAttribute('data-target');
        });
      });
    });
  }
  function render(){ renderShell(); }

  /* ===================== Progress ring ===================== */
  function progressRing(pct, size, strokeWidth, color){
    size = size||72; strokeWidth = strokeWidth||8;
    var r = (size-strokeWidth)/2;
    var c = 2*Math.PI*r;
    var offset = c - (Math.max(0,Math.min(100,pct))/100)*c;
    return '<div class="ring-wrap">'+
      '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
        '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--color-muted)" stroke-width="'+strokeWidth+'"/>'+
        '<circle class="ring-fill" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+strokeWidth+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c+'" data-target-offset="'+offset+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
      '</svg>'+
      '<div class="ring-value"><span class="count-up" data-target="'+pct+'">0</span>%</div>'+
    '</div>';
  }

  /* ===================== Dashboard ===================== */
  function pageDashboard(){
    var tasks = state.data.tasks, team = state.data.team, milestones = state.data.milestones;
    var total = tasks.length;
    var done = tasks.filter(function(t){return t.status==='done';}).length;
    var inprogress = tasks.filter(function(t){return t.status==='inprogress';}).length;
    var overdue = tasks.filter(function(t){return t.status!=='done' && t.due && daysUntil(t.due)<0;}).length;
    var pct = total ? Math.round(done/total*100) : 0;

    var maxLoad = Math.max(1, team.reduce(function(m,mem){
      var c = tasks.filter(function(t){return t.assignee===mem.id && t.status!=='done';}).length;
      return Math.max(m,c);
    },0));

    var upcoming = milestones.filter(function(m){return !m.completed;})
      .sort(function(a,b){return a.date<b.date?-1:1;}).slice(0,3);

    return ''+
    '<div class="topbar"><div><h1>Dashboard</h1><p>Overview of your graduation project — team, tasks, and milestones.</p></div></div>'+
    '<div class="grid stat-grid">'+
      statCard('Total tasks', total, ICONS.tasks, 'var(--color-primary)')+
      statCard('Completed', done, ICONS.check, 'var(--color-accent)')+
      statCard('In progress', inprogress, ICONS.edit, 'var(--color-warning)')+
      statCard('Overdue', overdue, ICONS.alert, 'var(--color-destructive)')+
    '</div>'+
    '<div class="dash-grid">'+
      '<div class="card">'+
        '<div class="ring-header">'+progressRing(pct, 64, 7, 'var(--color-primary)')+
          '<div><div class="section-title" style="margin-bottom:2px">Team workload</div>'+
          '<span style="font-weight:600;font-size:13px;color:var(--color-muted-foreground)">'+pct+'% tasks complete</span></div>'+
        '</div>'+
        team.map(function(mem, i){
          var count = tasks.filter(function(t){return t.assignee===mem.id && t.status!=='done';}).length;
          var w = Math.round(count/maxLoad*100);
          return '<div class="workload-row stagger-item" style="animation-delay:'+(i*40)+'ms">'+
            '<div class="avatar" style="background:'+colorFor(mem.id)+'">'+initials(mem.name)+'</div>'+
            '<div class="workload-info"><div class="name">'+escapeHtml(mem.name)+'</div><div class="role">'+escapeHtml(mem.role)+'</div>'+
            '<div class="workload-bar-track"><div class="workload-bar-fill" style="width:0%" data-target="'+w+'%"></div></div></div>'+
            '<div class="workload-count">'+count+' open</div>'+
          '</div>';
        }).join('')+
      '</div>'+
      '<div class="card">'+
        '<div class="section-title">Upcoming milestones</div>'+
        (upcoming.length ? upcoming.map(function(m, i){
          var d = daysUntil(m.date);
          var color = d<0 ? 'var(--color-destructive)' : 'var(--color-primary)';
          var meta = d<0 ? Math.abs(d)+' days overdue' : (d===0?'Due today':'In '+d+' days · '+fmtDate(m.date));
          return '<div class="milestone-mini stagger-item" style="animation-delay:'+(i*40)+'ms"><div class="dot" style="background:'+color+'"></div>'+
            '<div><div class="title">'+escapeHtml(m.title)+'</div><div class="meta">'+meta+'</div></div></div>';
        }).join('') : '<p style="color:var(--color-muted-foreground);font-size:14px">All milestones completed. 🎓</p>')+
      '</div>'+
    '</div>';
  }
  function statCard(label, value, icon, color){

      '<div class="stat-icon" style="background:color-mix(in srgb, '+color+' 15%, transparent);color:'+color+'">'+icon+'</div></div>';
  }

  /* ===================== Tasks (Kanban) ===================== */
  var TASK_COLS = [
    {id:'todo', label:'To Do'},
    {id:'inprogress', label:'In Progress'},
    {id:'done', label:'Done'}
  ];
  function pageTasks(){
    var team = state.data.team;
    var tasks = state.data.tasks.filter(function(t){
      return state.taskFilter==='all' || t.assignee===state.taskFilter;
    });
    return ''+
    '<div class="topbar"><div><h1>Tasks</h1><p>Drag cards between columns, or edit a task to change its status.</p></div>'+
      '<button class="btn btn-primary" id="add-task">'+ICONS.plus+'<span>New task</span></button></div>'+
    '<div class="kanban-toolbar">'+
      '<label for="assignee-filter" class="visually-hidden">Filter by team member</label>'+
      '<select id="assignee-filter" class="select" style="width:auto;min-width:200px">'+
        '<option value="all">All team members</option>'+
        team.map(function(m){return '<option value="'+m.id+'" '+(state.taskFilter===m.id?'selected':'')+'>'+escapeHtml(m.name)+'</option>';}).join('')+
      '</select>'+
    '</div>'+
    '<div class="kanban">'+
      TASK_COLS.map(function(col){
        var colTasks = tasks.filter(function(t){return t.status===col.id;});
        return '<div class="kanban-col" data-col="'+col.id+'">'+
          '<div class="kanban-col-head"><h3>'+col.label+'</h3><span class="count-pill">'+colTasks.length+'</span></div>'+
          (colTasks.length ? colTasks.map(function(t, i){ return taskCard(t, i); }).join('') : '<div class="empty-col">No tasks</div>')+
        '</div>';
      }).join('')+
    '</div>';
  }
  function taskCard(t, i){
    var member = state.data.team.filter(function(m){return m.id===t.assignee;})[0];
    var overdue = t.status!=='done' && t.due && daysUntil(t.due)<0;
    return '<div class="task-card stagger-item" style="animation-delay:'+((i||0)*35)+'ms" draggable="true" data-task="'+t.id+'" tabindex="0" role="button" aria-label="Edit task '+escapeHtml(t.title)+'">'+
      '<div class="task-card-top"><span class="badge badge-'+t.priority+'">'+t.priority.charAt(0).toUpperCase()+t.priority.slice(1)+'</span>'+
      (overdue ? '<span class="badge badge-overdue">'+ICONS.alert.replace('icon','icon icon-sm')+'Overdue</span>' : '')+
      '</div>'+
      '<div class="title">'+escapeHtml(t.title)+'</div>'+
      (t.description ? '<div class="desc">'+escapeHtml(t.description)+'</div>' : '')+
      '<div class="task-card-foot">'+
        (member ? '<div class="task-assignee"><div class="avatar" style="background:'+colorFor(member.id)+'">'+initials(member.name)+'</div>'+escapeHtml(member.name.split(' ')[0])+'</div>' : '<span></span>')+
        (t.due ? '<div class="task-due">'+ICONS.calendar.replace('icon','icon icon-sm')+fmtDate(t.due)+'</div>' : '')+
      '</div>'+
    '</div>';
  }

  /* ===================== Milestones ===================== */
  function pageMilestones(){
    var ms = state.data.milestones.slice().sort(function(a,b){return a.date<b.date?-1:1;});
    var done = ms.filter(function(m){return m.completed;}).length;
    var pct = ms.length ? Math.round(done/ms.length*100) : 0;
    return ''+
    '<div class="topbar"><div><h1>Milestones</h1><p>Key phases and deadlines for the project.</p></div>'+
      '<button class="btn btn-primary" id="add-milestone">'+ICONS.plus+'<span>New milestone</span></button></div>'+
    '<div class="card" style="margin-bottom:var(--space-5)">'+
      '<div class="ring-header">'+progressRing(pct, 72, 8, 'var(--color-accent)')+
        '<div><div class="section-title" style="margin-bottom:2px">Overall progress</div>'+
        '<span style="font-weight:700">'+done+' / '+ms.length+' complete</span></div>'+
      '</div>'+
    '</div>'+
    (ms.length ? '<div class="timeline">'+ ms.map(function(m, i){
        var isNext = !m.completed && nextMilestoneId(ms)===m.id;
        return milestoneItem(m, i, isNext);
      }).join('') +'</div>' :
      '<div class="empty-state">'+ICONS.empty+'<p>No milestones yet. Add your first one.</p></div>');
  }
  function nextMilestoneId(ms){
    for(var i=0;i<ms.length;i++){ if(!ms[i].completed) return ms[i].id; }
    return null;
  }
  function milestoneItem(m, i, isNext){
    var overdue = !m.completed && daysUntil(m.date)<0;
    var status = m.completed ? {cls:'badge-done', label:'Completed', icon:ICONS.check} :
                 overdue ? {cls:'badge-overdue', label:'Overdue', icon:ICONS.alert} :
                 {cls:'badge-upcoming', label:'Upcoming', icon:ICONS.flag};
    var dotColor = m.completed ? 'var(--color-accent)' : overdue ? 'var(--color-destructive)' : 'var(--color-primary)';
    return '<div class="timeline-item stagger-item" style="animation-delay:'+((i||0)*45)+'ms">'+
      '<div class="timeline-dot'+(isNext?' pulse':'')+'" style="background:'+dotColor+'">'+ (m.completed? ICONS.check.replace('icon','icon-sm') : ICONS.flag.replace('icon','icon-sm')) +'</div>'+
      '<div class="timeline-card">'+
        '<div class="timeline-card-top"><div><h4>'+escapeHtml(m.title)+'</h4><div class="timeline-date">'+fmtDate(m.date)+'</div></div>'+
        '<span class="badge '+status.cls+'">'+status.icon.replace('icon','icon-sm')+status.label+'</span></div>'+
        (m.description ? '<div class="timeline-desc">'+escapeHtml(m.description)+'</div>' : '')+
        '<div class="timeline-actions">'+
          '<button class="btn btn-secondary btn-sm" data-toggle-milestone="'+m.id+'">'+ICONS.check+'<span>'+(m.completed?'Mark incomplete':'Mark complete')+'</span></button>'+
          '<button class="btn btn-secondary btn-sm" data-edit-milestone="'+m.id+'">'+ICONS.edit+'<span>Edit</span></button>'+
          '<button class="btn btn-danger btn-sm" data-del-milestone="'+m.id+'" aria-label="Delete '+escapeHtml(m.title)+'">'+ICONS.trash+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  /* ===================== Wire up page interactions ===================== */
  function wirePage(){
    if(state.page==='team'){
      document.getElementById('add-member').addEventListener('click', function(){ openMemberModal(null); });
      Array.prototype.forEach.call(document.querySelectorAll('[data-edit-member]'), function(b){
        b.addEventListener('click', function(){ openMemberModal(b.getAttribute('data-edit-member')); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-del-member]'), function(b){
        b.addEventListener('click', function(){ deleteMember(b.getAttribute('data-del-member')); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-upload-member]'), function(b){
        b.addEventListener('click', function(){ triggerMemberFileUpload(b.getAttribute('data-upload-member')); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-remove-file]'), function(b){
        b.addEventListener('click', function(){
          var parts = b.getAttribute('data-remove-file').split('|');
          removeMemberFile(parts[0], parts[1]);
        });
      });
      attachTilt(document.querySelectorAll('.team-card'));
    }
    if(state.page==='tasks'){
      document.getElementById('add-task').addEventListener('click', function(){ openTaskModal(null); });
      document.getElementById('assignee-filter').addEventListener('change', function(e){
        state.taskFilter = e.target.value; renderPage();
      });
      Array.prototype.forEach.call(document.querySelectorAll('.task-card'), function(card){
        card.addEventListener('click', function(){ openTaskModal(card.getAttribute('data-task')); });
        card.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openTaskModal(card.getAttribute('data-task')); } });
        card.addEventListener('dragstart', function(e){ e.dataTransfer.setData('text/plain', card.getAttribute('data-task')); card.classList.add('dragging'); });
        card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.kanban-col'), function(col){
        col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drag-over'); });
        col.addEventListener('dragleave', function(){ col.classList.remove('drag-over'); });
        col.addEventListener('drop', function(e){
          e.preventDefault(); col.classList.remove('drag-over');
          var id = e.dataTransfer.getData('text/plain');
          var status = col.getAttribute('data-col');
          var task = state.data.tasks.filter(function(t){return t.id===id;})[0];
          if(task && task.status !== status){
            var prevStatus = task.status;
            task.status = status; renderPage();
            api('PUT', '/api/tasks/'+id, {status: status}).catch(function(err){
              task.status = prevStatus; renderPage();
              toast('Failed to move task: '+err.message);
            });
          }
        });
      });
      attachTilt(document.querySelectorAll('.task-card'));
    }
    if(state.page==='milestones'){
      var addBtn = document.getElementById('add-milestone');
      if(addBtn) addBtn.addEventListener('click', function(){ openMilestoneModal(null); });
      Array.prototype.forEach.call(document.querySelectorAll('[data-toggle-milestone]'), function(b){
        b.addEventListener('click', function(){
          var id = b.getAttribute('data-toggle-milestone');
          var m = state.data.milestones.filter(function(x){return x.id===id;})[0];
          if(m){
            var prevCompleted = m.completed;
            m.completed = !m.completed;
            if(m.completed){
              var rect = b.getBoundingClientRect();
              confettiBurst(rect.left+rect.width/2, rect.top+rect.height/2);
            }
            renderPage();
            api('PUT', '/api/milestones/'+id, {completed: m.completed}).catch(function(err){
              m.completed = prevCompleted; renderPage();
              toast('Failed to update: '+err.message);
            });
          }
        });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-edit-milestone]'), function(b){
        b.addEventListener('click', function(){ openMilestoneModal(b.getAttribute('data-edit-milestone')); });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-del-milestone]'), function(b){
        b.addEventListener('click', function(){ deleteMilestone(b.getAttribute('data-del-milestone')); });
      });
    }
  }

  /* ===================== Modal helpers ===================== */
  var lastFocused = null;
  function openModal(html, onMount){
    lastFocused = document.activeElement;
    var root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
    var backdrop = document.getElementById('modal-backdrop');
    backdrop.addEventListener('mousedown', function(e){ if(e.target===backdrop) closeModal(); });
    document.addEventListener('keydown', escHandler);
    if(onMount) onMount(root);
    var focusable = root.querySelector('input,select,textarea,button');
    if(focusable) focusable.focus();
  }
  function escHandler(e){ if(e.key==='Escape') closeModal(); }
  function closeModal(){
    var root = document.getElementById('modal-root');
    var backdrop = document.getElementById('modal-backdrop');
    document.removeEventListener('keydown', escHandler);
    if(!backdrop){ root.innerHTML = ''; return; }
    backdrop.classList.add('closing');
    var modalEl = backdrop.querySelector('.modal');
    if(modalEl) modalEl.classList.add('closing');
    setTimeout(function(){
      root.innerHTML = '';
      if(lastFocused && lastFocused.focus) lastFocused.focus();
    }, 150);
  }

  function memberOptions(selected){
    return state.data.team.map(function(m){
      return '<option value="'+m.id+'" '+(m.id===selected?'selected':'')+'>'+escapeHtml(m.name)+'</option>';
    }).join('');
  }

  /* ---- Member modal ---- */
  function openMemberModal(id){
    var m = id ? state.data.team.filter(function(x){return x.id===id;})[0] : {id:null,name:'',role:'',email:'',phone:''};
    openModal(
      '<div class="modal-head"><h2>'+(id?'Edit member':'Add member')+'</h2>'+
        '<button class="icon-btn" id="modal-close" aria-label="Close dialog">'+ICONS.x+'</button></div>'+
      '<form id="member-form">'+
        '<div class="field"><label for="mf-name">Full name</label><input class="input" id="mf-name" required value="'+escapeHtml(m.name)+'"></div>'+
        '<div class="field"><label for="mf-role">Role</label><input class="input" id="mf-role" placeholder="e.g. Team Lead" value="'+escapeHtml(m.role)+'"></div>'+
        '<div class="field"><label for="mf-email">Email</label><input class="input" type="email" id="mf-email" value="'+escapeHtml(m.email)+'"></div>'+
        '<div class="field"><label for="mf-phone">Phone</label><input class="input" type="tel" id="mf-phone" value="'+escapeHtml(m.phone)+'"></div>'+
        '<div class="modal-actions"><button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>'+
        '<button type="submit" class="btn btn-primary">'+(id?'Save changes':'Add member')+'</button></div>'+
      '</form>',
      function(root){
        root.querySelector('#modal-close').addEventListener('click', closeModal);
        root.querySelector('#modal-cancel').addEventListener('click', closeModal);
        root.querySelector('#member-form').addEventListener('submit', function(e){
          e.preventDefault();
          var name = root.querySelector('#mf-name').value.trim();
          if(!name) return;
          var obj = {
            name: name,
            role: root.querySelector('#mf-role').value.trim(),
            email: root.querySelector('#mf-email').value.trim(),
            phone: root.querySelector('#mf-phone').value.trim()
          };
          var submitBtn = root.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          var req = id ? api('PUT', '/api/team/'+id, obj) : api('POST', '/api/team', obj);
          req.then(function(saved){
            if(id){ Object.assign(m, saved); toast('Member updated'); }
            else { saved.files = []; state.data.team.push(saved); toast('Member added'); }
            closeModal(); renderPage();
          }).catch(function(err){
            submitBtn.disabled = false;
            toast('Failed: '+err.message);
          });
        });
      }
    );
  }
  function deleteMember(id){
    var m = state.data.team.filter(function(x){return x.id===id;})[0];
    if(!m) return;
    openModal(
      '<div class="modal-head"><h2>Remove team member?</h2>'+
        '<button class="icon-btn" id="modal-close" aria-label="Close dialog">'+ICONS.x+'</button></div>'+
      '<p style="color:var(--color-muted-foreground)">This removes <strong>'+escapeHtml(m.name)+'</strong> from the team. Their assigned tasks will become unassigned.</p>'+
      '<div class="modal-actions"><button class="btn btn-secondary" id="modal-cancel">Cancel</button>'+
      '<button class="btn btn-danger" id="confirm-del" style="background:var(--color-destructive);color:#fff">Remove</button></div>',
      function(root){
        root.querySelector('#modal-close').addEventListener('click', closeModal);
        root.querySelector('#modal-cancel').addEventListener('click', closeModal);
        root.querySelector('#confirm-del').addEventListener('click', function(){
          api('DELETE', '/api/team/'+id).then(function(){
            state.data.team = state.data.team.filter(function(x){return x.id!==id;});
            state.data.tasks.forEach(function(t){ if(t.assignee===id) t.assignee=null; });
            closeModal(); toast('Member removed'); renderPage();
          }).catch(function(err){ toast('Failed: '+err.message); });
        });
      }
    );
  }

  /* ---- Member files ---- */
  var pendingUploadMemberId = null;
  var MAX_FILE_BYTES = 5*1024*1024;
  function triggerMemberFileUpload(memberId){
    pendingUploadMemberId = memberId;
    document.getElementById('member-file-input').click();
  }
  document.getElementById('member-file-input').addEventListener('change', function(e){
    var files = Array.prototype.slice.call(e.target.files);
    var memberId = pendingUploadMemberId;
    var member = state.data.team.filter(function(x){return x.id===memberId;})[0];
    e.target.value = '';
    if(!member || !files.length) return;
    var toSend = files.filter(function(f){
      if(f.size > MAX_FILE_BYTES){ toast('Skipped '+f.name+' (over 5MB)'); return false; }
      return true;
    });
    if(!toSend.length) return;
    var formData = new FormData();
    toSend.forEach(function(f){ formData.append('files', f); });
    fetch('/api/team/'+memberId+'/files', { method:'POST', body: formData })
      .then(function(res){
        if(!res.ok) return res.json().catch(function(){return {};}).then(function(err){ throw new Error(err.error || 'Upload failed'); });
        return res.json();
      })
      .then(function(created){
        if(!member.files) member.files = [];
        member.files = member.files.concat(created);
        toast(created.length>1 ? 'Files uploaded' : 'File uploaded');
        renderPage();
      })
      .catch(function(err){ toast('Upload failed: '+err.message); });
  });
  function removeMemberFile(memberId, fileId){
    api('DELETE', '/api/files/'+fileId).then(function(){
      var member = state.data.team.filter(function(x){return x.id===memberId;})[0];
      if(member && member.files) member.files = member.files.filter(function(f){return f.id!==fileId;});
      toast('File removed'); renderPage();
    }).catch(function(err){ toast('Failed: '+err.message); });
  }

          var req = id ? api('PUT', '/api/tasks/'+id, obj) : api('POST', '/api/tasks', obj);
          req.then(function(saved){
            if(id){ Object.assign(t, saved); toast('Task updated'); }
            else { state.data.tasks.push(saved); toast('Task created'); }
            closeModal(); renderPage();
          }).catch(function(err){
            submitBtn.disabled = false;
            toast('Failed: '+err.message);
          });
        });
      }
    );
  }

  /* ---- Milestone modal ---- */
  function openMilestoneModal(id){
    var m = id ? state.data.milestones.filter(function(x){return x.id===id;})[0] : null;
    var v = m || {title:'', date: todayISO(), description:'', completed:false};
    openModal(
      '<div class="modal-head"><h2>'+(id?'Edit milestone':'New milestone')+'</h2>'+
        '<button class="icon-btn" id="modal-close" aria-label="Close dialog">'+ICONS.x+'</button></div>'+
      '<form id="ms-form">'+
        '<div class="field"><label for="msf-title">Title</label><input class="input" id="msf-title" required value="'+escapeHtml(v.title)+'"></div>'+
        '<div class="field"><label for="msf-date">Target date</label><input class="input" type="date" id="msf-date" required value="'+v.date+'"></div>'+
        '<div class="field"><label for="msf-desc">Description</label><textarea id="msf-desc">'+escapeHtml(v.description)+'</textarea></div>'+
        '<div class="modal-actions">'+
          (id ? '<button type="button" class="btn btn-danger" id="ms-delete" style="margin-right:auto">'+ICONS.trash+'<span>Delete</span></button>' : '')+
          '<button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>'+
          '<button type="submit" class="btn btn-primary">'+(id?'Save changes':'Add milestone')+'</button>'+
        '</div>'+
      '</form>',
      function(root){
        root.querySelector('#modal-close').addEventListener('click', closeModal);
        root.querySelector('#modal-cancel').addEventListener('click', closeModal);
        if(id){
          root.querySelector('#ms-delete').addEventListener('click', function(){
            api('DELETE', '/api/milestones/'+id).then(function(){
              state.data.milestones = state.data.milestones.filter(function(x){return x.id!==id;});
              closeModal(); toast('Milestone deleted'); renderPage();
            }).catch(function(err){ toast('Failed: '+err.message); });
          });
        }
        root.querySelector('#ms-form').addEventListener('submit', function(e){
          e.preventDefault();
          var title = root.querySelector('#msf-title').value.trim();
          if(!title) return;
          var obj = {
            title: title,
            date: root.querySelector('#msf-date').value,
            description: root.querySelector('#msf-desc').value.trim(),
            completed: v.completed
          };
          var submitBtn = root.querySelector('button[type="submit"]');
          submitBtn.disabled = true;
          var req = id ? api('PUT', '/api/milestones/'+id, obj) : api('POST', '/api/milestones', obj);
          req.then(function(saved){
            if(id){ Object.assign(m, saved); toast('Milestone updated'); }
            else { state.data.milestones.push(saved); toast('Milestone added'); }
            closeModal(); renderPage();
          }).catch(function(err){
            submitBtn.disabled = false;
            toast('Failed: '+err.message);
          });
        });
      }
    );
  }
  function deleteMilestone(id){
    api('DELETE', '/api/milestones/'+id).then(function(){
      state.data.milestones = state.data.milestones.filter(function(x){return x.id!==id;});
      toast('Milestone deleted'); renderPage();
    }).catch(function(err){ toast('Failed: '+err.message); });
  }

  /* ===================== Tilt & confetti ===================== */
  function attachTilt(nodeList){
    if(prefersReducedMotion) return;
    Array.prototype.forEach.call(nodeList, function(el){
      el.addEventListener('mousemove', function(e){
        if(el.classList.contains('dragging')) return;
        var rect = el.getBoundingClientRect();
        var px = (e.clientX-rect.left)/rect.width - 0.5;
        var py = (e.clientY-rect.top)/rect.height - 0.5;
        el.style.transform = 'perspective(700px) rotateX('+(py*-8)+'deg) rotateY('+(px*8)+'deg) translateY(-4px) scale(1.015)';
      });
      el.addEventListener('mouseleave', function(){ el.style.transform=''; });
    });
  }
  function confettiBurst(x, y){
    if(prefersReducedMotion) return;
    var colors = ['#2563EB','#059669','#D97706','#7C3AED','#DB2777','#0891B2'];
    var layer = document.createElement('div');
    layer.className = 'confetti-layer';
    document.body.appendChild(layer);
    for(var i=0;i<24;i++){
      var p = document.createElement('span');
      p.className = 'confetti-piece';
      var angle = Math.random()*Math.PI*2;
      var dist = 60 + Math.random()*90;
      p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
      p.style.setProperty('--dy', (Math.sin(angle)*dist-40)+'px');
      p.style.setProperty('--rot', (Math.random()*720-360)+'deg');
      p.style.background = colors[i % colors.length];
      p.style.left = x+'px'; p.style.top = y+'px';
      p.style.animationDelay = (Math.random()*80)+'ms';
      layer.appendChild(p);
    }
    setTimeout(function(){ layer.remove(); }, 1200);
  }

  /* ===================== Export / Import ===================== */
  function exportData(){
    var blob = new Blob([JSON.stringify(state.data, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'gradtrack-backup-'+todayISO()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Data exported');
  }
  document.getElementById('import-input').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var parsed;
      try{
        parsed = JSON.parse(reader.result);
        if(!parsed.team || !parsed.tasks || !parsed.milestones) throw new Error('bad shape');
      }catch(err){
        toast('Import failed: invalid file');
        return;
      }
      api('POST', '/api/import', parsed).then(function(data){
        state.data = data; render(); toast('Data imported');
      }).catch(function(err){ toast('Import failed: '+err.message); });
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ===================== Init ===================== */
  initTheme();
  window.addEventListener('resize', positionNavIndicator);
  loadData().then(function(){
    render();
  }).catch(function(){
    document.getElementById('app').innerHTML = '<div class="empty-state" style="margin:auto"><p>Could not reach the server. Is it running?</p></div>';
  }).then(function(){
    var splash = document.getElementById('splash');
    if(splash) splash.classList.add('hide');
  });
})();
</script>
